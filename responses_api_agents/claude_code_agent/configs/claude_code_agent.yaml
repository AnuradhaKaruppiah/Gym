claude_code_agent:
  responses_api_agents:
    claude_code_agent:
      entrypoint: app.py
      resources_server: null
      concurrency: 32
      command: claude
      model: claude-sonnet-4-6
      anthropic_api_key: ${anthropic_api_key}
      anthropic_base_url: null
      max_turns: 30
      timeout: 300
      system_prompt: null
      allowed_tools: null
      disallowed_tools: null
      claude_code_version: null
      thinking: null
      max_thinking_tokens: null
      bare: true
      work_dir: null
      workspace_root: outputs/claude_code_agent/workspaces
      container_formatter: null
      apptainer_command: apptainer
      setup_timeout: 900
      nemo_flow:
        enabled: false
        command: nemo-relay
        agent: claude-code
        output_dir: null
        atof_filename: claude-code.atof.jsonl
        atif_filename_template: claude-code-{session_id}.atif.json
        agent_name: claude-code
        mode: overwrite
      verify_swebench: false
      swebench_setup_dir: null
      swebench_results_root: outputs/claude_code_agent/swebench-verifier
      swebench_verifier_timeout: 1200
      swebench_model_name: claude_code_agent
